<!doctype html>
<html lang="bg"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09111f"><title>DeepStats · Visual Demo</title>
<link rel="stylesheet" href="./style.css?v=2"><style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#eaf0fb;background:#09111f;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}.app{max-width:550px;margin:auto;min-height:100dvh;padding:18px 16px 98px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}.logo{font-size:22px;font-weight:900;letter-spacing:-.7px}.logo b{color:#65e4b5}.demo{font-size:10px;font-weight:800;letter-spacing:1.2px;border:1px solid #e2bd6b;color:#e2bd6b;padding:6px 9px;border-radius:8px}.muted{color:#8798b4}.date{font-size:12px;color:#a9b8ce}.heading{font-size:28px;font-weight:800;letter-spacing:-1px;margin:4px 0 18px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:14px 0 22px}.stat,.card,.panel{background:#121f32;border:1px solid #25364c;border-radius:16px}.stat{padding:14px 10px}.stat strong{display:block;font-size:21px}.stat span{display:block;font-size:11px;color:#9cadc4;margin-top:4px}.green{color:#65e4b5}.yellow{color:#eecb79}.red{color:#ff8b91}.filters{display:flex;gap:8px;overflow:auto;padding-bottom:12px;scrollbar-width:none}.chip{white-space:nowrap;border:1px solid #2b3d56;background:#15253b;color:#b6c7df;border-radius:30px;padding:9px 13px;font-size:12px}.chip.active{background:#1e6b58;border-color:#3ab68c;color:white}.card{padding:16px;margin-bottom:12px}.cardtop,.between{display:flex;justify-content:space-between;align-items:center;gap:8px}.league{font-size:11px;color:#93a6c0}.time{font-size:11px;color:#c4d2e4}.teams{font-size:17px;font-weight:800;margin:12px 0 14px;line-height:1.4}.pick{background:#1b3042;border-radius:11px;padding:12px;display:flex;align-items:center;justify-content:space-between;gap:12px}.pick small{display:block;color:#95a9c0;font-size:10px;margin-bottom:5px}.pick strong{font-size:13px}.odd{font-size:21px;font-weight:850;color:#65e4b5}.tag{display:inline-block;border-radius:7px;background:#273d50;color:#bad0e5;padding:5px 7px;font-size:10px;margin-top:12px}.detail{border:0;background:none;color:#70ddb5;padding:12px 0 0;font-weight:700;font-size:12px}.details{display:none;border-top:1px solid #2b3b50;margin-top:12px;padding-top:12px}.details.open{display:block}.mini{display:grid;grid-template-columns:1fr 1fr;gap:9px}.mini>div{background:#0c192a;border-radius:10px;padding:12px}.mini strong{display:block;font-size:17px;margin-top:4px}.nav{position:fixed;bottom:0;left:0;right:0;background:#101b2c;border-top:1px solid #2a3c53;display:flex;justify-content:space-around;padding:10px 4px max(12px,env(safe-area-inset-bottom));z-index:5}.nav button{background:none;border:0;color:#8397b1;font-size:11px;min-width:60px;display:grid;gap:5px;justify-items:center}.nav button.active{color:#65e4b5}.nav i{font-style:normal;font-size:21px}.panel{padding:17px;margin-bottom:12px}.panel h3{margin:0 0 14px;font-size:16px}.bar{height:8px;background:#2b3d53;border-radius:10px;overflow:hidden;margin:9px 0}.bar>span{display:block;height:100%;background:#59d4a4;border-radius:10px}.rowline{display:flex;justify-content:space-between;margin:12px 0;font-size:13px}.builderItem{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #2c3d53;padding:13px 0;font-size:13px;gap:12px}.builderItem:last-child{border:0}.btn{border:0;background:#38b88d;color:#061c18;font-weight:800;border-radius:11px;padding:13px 15px;width:100%;margin-top:14px}.empty{padding:30px;text-align:center;color:#9aabc3}.search{width:100%;background:#14243a;color:#e8f0fc;border:1px solid #30425a;border-radius:12px;padding:12px;margin-bottom:12px}.sub{font-size:12px;color:#8da0b9;margin:0 0 16px}.toast{position:fixed;top:15px;left:50%;transform:translateX(-50%);background:#244b43;padding:12px 18px;border-radius:12px;font-size:12px;display:none;z-index:10}
 .app{max-width:760px;padding:0 16px 110px}.top{margin:0 -16px 22px;padding:16px 20px;height:76px}.logo{display:none}.heading{font-size:26px}.stat,.card,.panel{background:var(--surface,#0e1b2a);border-color:var(--line,#23364c)}.nav{background:#0b1828}.nav button.active{color:#42a9ff}.odd,.green{color:#29e184}.chip.active{background:#1168ad;border-color:#1289ff}.btn{background:#1289ff;color:white}.demo{color:#7ebeff;border-color:#2e75a7}.pick{background:#14283b}.detail{color:#59b7ff} </style></head><body><div class="app"><header class="top"><div class="brand"><span class="brand-mark" style="font-size:26px;color:#1289ff">▥</span><div><strong>DeepStats</strong><small>FOOTBALL INTELLIGENCE · DEMO</small></div></div><span class="demo">DEMO DATA</span></header><main id="main"></main></div><nav class="nav" id="nav"></nav><div class="toast" id="toast"></div>
<script>
const matches=[{id:1,league:'Англия · Висша лига',time:'17:00',home:'Arsenal',away:'Brighton',pick:'Над 2.5 гола',odds:1.84,level:'Силна',group:'Голове',homeForm:'8/10',awayForm:'7/10',prob:71},{id:2,league:'Испания · Ла Лига',time:'19:30',home:'Real Sociedad',away:'Villarreal',pick:'Гол / Гол',odds:1.78,level:'Средна',group:'Голове',homeForm:'7/10',awayForm:'8/10',prob:68},{id:3,league:'Германия · Бундеслига',time:'16:30',home:'Bayer Leverkusen',away:'Mainz',pick:'Победа домакин',odds:1.67,level:'Силна',group:'Победа',homeForm:'9/10',awayForm:'6/10',prob:76},{id:4,league:'Италия · Серия А',time:'21:45',home:'Atalanta',away:'Torino',pick:'Над 8.5 корнера',odds:1.91,level:'Средна',group:'Корнери',homeForm:'7/10',awayForm:'7/10',prob:65},{id:5,league:'Франция · Лига 1',time:'22:00',home:'Lille',away:'Rennes',pick:'Домакин над 4.5 точни удара',odds:1.95,level:'Силна',group:'Удари',homeForm:'8/10',awayForm:'6/10',prob:69}];
const strategy=[{name:'A · Отборни удари',count:12,yield:18.4},{name:'B · Точни удари',count:8,yield:12.7},{name:'C · Голове',count:16,yield:21.2},{name:'D · Победа',count:9,yield:8.6}];let tab='home',filter='Всички',search='',chosen=new Set();const $=s=>document.querySelector(s);const money=n=>n.toFixed(2);function notify(t){const x=$('#toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',2200)}
function card(m){return '<article class="card"><div class="cardtop"><span class="league">'+m.league+'</span><span class="time">◷ '+m.time+'</span></div><div class="teams">'+m.home+' <span class="muted">–</span> '+m.away+'</div><div class="pick"><div><small>ПРОГНОЗА · '+m.group.toUpperCase()+'</small><strong>'+m.pick+'</strong></div><div class="odd">'+money(m.odds)+'</div></div><div class="between"><span class="tag">'+m.level+' · '+m.prob+'% модел</span><button class="detail" onclick="toggle('+m.id+')">Детайли ↓</button></div><div class="details" id="d'+m.id+'"><div class="mini"><div><span class="muted">Домакин · посл. 10</span><strong>'+m.homeForm+'</strong></div><div><span class="muted">Гост · посл. 10</span><strong>'+m.awayForm+'</strong></div></div><button class="btn" onclick="add('+m.id+')">'+(chosen.has(m.id)?'✓ Добавен в билдър':'+ Добави в билдър')+'</button></div></article>'}
function toggle(id){$('#d'+id).classList.toggle('open')}function add(id){chosen.has(id)?chosen.delete(id):chosen.add(id);notify(chosen.has(id)?'Добавено в демо билдъра':'Премахнато');render()}
function render(){const title={home:'Начало',matches:'Мачове днес',builder:'Билдъри и сингли',stats:'Статистика'};let out='<div class="date">КОНТРОЛЕН ЦЕНТЪР · ДЕМО</div><h1 class="heading">'+title[tab]+'</h1>';if(tab==='home'){out+='<div class="stats"><div class="stat"><strong>24</strong><span>Мачове днес</span></div><div class="stat"><strong class="green">+18.4%</strong><span>Yield · демо</span></div><div class="stat"><strong class="yellow">67%</strong><span>Успеваемост</span></div></div><div class="between"><h3>Топ селекции</h3><button class="detail" onclick="go(\'matches\')">Всички →</button></div>'+matches.slice(0,3).map(card).join('')}
if(tab==='matches'){out+='<input class="search" placeholder="Търси отбор или прогноза…" value="'+search.replace(/"/g,'&quot;')+'" oninput="search=this.value;drawMatches()" id="search"><div class="filters">'+['Всички','Голове','Победа','Удари','Корнери'].map(f=>'<button class="chip '+(filter===f?'active':'')+'" onclick="setFilter(\''+f+'\')">'+f+'</button>').join('')+'</div><div id="matchList"></div>'}
if(tab==='builder'){const items=matches.filter(m=>chosen.has(m.id));const odds=items.reduce((n,m)=>n*m.odds,1);out+='<p class="sub">Избери прогнози от „Мачове днес“ и виж как изглежда комбинираният залог.</p><div class="panel"><h3>Моят демо билдър</h3>'+(items.length?items.map(m=>'<div class="builderItem"><span>'+m.home+' – '+m.away+'<br><span class="muted">'+m.pick+'</span></span><strong>'+money(m.odds)+'</strong></div>').join(''):'<div class="empty">Все още няма избрани прогнози.</div>')+'<div class="rowline"><span>Селекции</span><strong>'+items.length+'</strong></div><div class="rowline"><span>Общ коефициент</span><strong class="green">'+money(odds)+'</strong></div><button class="btn" onclick="notify(\'Това е визуално демо — не се изпращат залози\')">Преглед на билдър</button></div>'}
if(tab==='stats'){out+='<div class="stats"><div class="stat"><strong>145</strong><span>Залози</span></div><div class="stat"><strong class="green">+24.8u</strong><span>Печалба</span></div><div class="stat"><strong>64.1%</strong><span>Win rate</span></div></div><div class="panel"><h3>Резултати по стратегии</h3>'+strategy.map(s=>'<div class="rowline"><span>'+s.name+'</span><strong class="green">+'+s.yield+'%</strong></div><div class="bar"><span style="width:'+Math.min(s.yield*3.4,100)+'%"></span></div>').join('')+'</div><p class="sub">Всички стойности на този екран са измислени и служат само за визуален тест.</p>'}
$('#main').innerHTML=out;$('#nav').innerHTML=[['home','⌂','Начало'],['matches','⚽','Мачове'],['builder','▦','Билдъри'],['stats','▥','Статистика']].map(([id,ico,label])=>'<button class="'+(tab===id?'active':'')+'" onclick="go(\''+id+'\')"><i>'+ico+'</i>'+label+'</button>').join('');if(tab==='matches')drawMatches()}
function drawMatches(){let q=search.toLowerCase();let list=matches.filter(m=>(filter==='Всички'||m.group===filter)&&[m.home,m.away,m.pick].join(' ').toLowerCase().includes(q));$('#matchList').innerHTML=list.length?list.map(card).join(''):'<div class="empty">Няма мачове за избрания филтър.</div>'}function setFilter(f){filter=f;render()}function go(t){tab=t;search='';render();scrollTo(0,0)}render();
</script></body></html>
