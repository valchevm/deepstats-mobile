name: DeepStats code checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  syntax-and-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate server APIs, scripts and client
        run: npm run check
      - name: Verify PWA version references match
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const html=readFileSync('public/index.html','utf8');
          const worker=readFileSync('public/sw.js','utf8');
          const app=html.match(/app\.js\?v=\d+/)?.[0];
          if(!app||!worker.includes(app))throw Error('PWA app.js versions do not match');
          if(!html.includes('style.css?v='))throw Error('Missing stylesheet version');
          console.log('PWA assets OK:',app);
          NODE
