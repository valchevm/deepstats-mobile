name: Daily Oracle archive at 12 Sofia
on:
  schedule:
    - cron: '0 9 * * *'
    - cron: '0 10 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deepstats-oracle-daily
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Archive historical results and odds
        env:
          ADMIN_ACCESS_TOKEN: ${{ secrets.ADMIN_ACCESS_TOKEN }}
          DEEPSTATS_URL: https://deepstats-mobile.vercel.app
        run: node scripts/daily-oracle-archive.mjs
