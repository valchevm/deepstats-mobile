name: Incremental DeepStats workbook sync
on:
  workflow_dispatch:
    inputs:
      live:
        description: 'Write changed rows into the NEW workbook (source is read-only)'
        required: false
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: deepstats-master-sheet-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate script
        run: node --check scripts/run-workbook-sync.mjs
      - name: Compare source and new workbook, write only if explicitly enabled
        env:
          ADMIN_ACCESS_TOKEN: ${{ secrets.ADMIN_ACCESS_TOKEN }}
          DEEPSTATS_URL: https://deepstats-mobile.vercel.app
          SYNC_LIVE: ${{ inputs.live && '1' || '0' }}
        run: node scripts/run-workbook-sync.mjs
